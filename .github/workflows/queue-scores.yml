name: Interconnection queue scores

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install gridstatus pandas pyarrow
      - name: Build queue data
        env:
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
        run: python scripts/queue_scores.py --isos ercot pjm
      - name: Commit if changed
        run: |
          git config user.name "voltlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/queue
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: refresh interconnection queue scores"
          git push
