name: ERCOT price archive

on:
  schedule:
    - cron: "41 14 * * 0"   # Sundays ~6-7am Pacific; MIS keeps ~30 days, so weekly has slack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ercot-price-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas pyarrow requests

      - name: Archive new DAM prices + mapping snapshot
        run: python scripts/ercot_price_archive.py

      - name: Commit if changed
        run: |
          git config user.name "voltlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ercot
          git diff --cached --quiet && echo "No new data" && exit 0
          git commit -m "data: archive ERCOT DAM prices $(date -u +%F)"
          git push
